name: CI Pipeline

on:
  push:
    branches: [ main, master, dev, contributions ]
  pull_request:
    branches: [ main, master, contributions ]

jobs:
  security-audit:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  smart-contracts:
    name: Soroban Smart Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Tests
        run: |
          cd contracts/trustpay-escrow
          cargo test

      - name: Build WASM Target
        run: |
          cd contracts/trustpay-escrow
          cargo build --target wasm32-unknown-unknown --release

  backend:
    name: Express API Backend (Node / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Backend Unit Tests (Vitest)
        run: npm test

      - name: Build Production Output
        run: npm run build
        env:
          PORT: 5000
          SUPABASE_URL: https://dummy-supabase-project.supabase.co
          SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build-purposes

  frontend:
    name: Next.js Frontend (React / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Unit & Component Tests (Vitest)
        run: npm test

      - name: Next.js Typecheck & Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-supabase-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build-purposes
          NEXT_PUBLIC_SOROBAN_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
