name: 🐛 Bug Report
description: Create a report to help us improve TrustPay Escrow
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much details as possible.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g., Wallet signature error when submitting milestone on testnet
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Trace
      description: Copy and paste any browser console logs or contract error codes.
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - Soroban Smart Contracts (Rust)
        - Express API Backend
        - Next.js Frontend Client
        - Supabase Database / Storage
        - Freighter Wallet Integration
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Stellar Testnet
        - Stellar Futurenet
        - Local Standalone Docker / Soroban-CLI
        - Production Mainnet
    validations:
      required: true
